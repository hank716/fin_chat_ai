<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI 多市場研究報告{% endblock %}</title>
  <style>
    :root { --fact:#1b8a5a; --calc:#1f6feb; --infer:#b07d18; --limit:#6b7280; --bg:#f7f8fa; --card:#fff; --bd:#e3e6ea; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#1a1d21; font-family:-apple-system,"Noto Sans TC","Segoe UI",Roboto,sans-serif; line-height:1.6; }
    .wrap { max-width:860px; margin:0 auto; padding:24px 18px 80px; }
    header h1 { margin:0 0 4px; font-size:1.5rem; }
    .meta { color:#6b7280; font-size:.86rem; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:18px 20px; margin:16px 0; }
    .summary { font-size:1.06rem; }
    h2 { font-size:1.12rem; margin:22px 0 8px; }
    ul.claims { list-style:none; padding:0; margin:0; }
    ul.claims li { padding:7px 0; border-bottom:1px dashed var(--bd); }
    ul.claims li:last-child { border-bottom:0; }
    .tag { display:inline-block; font-size:.72rem; font-weight:700; color:#fff; border-radius:5px; padding:1px 7px; margin-right:7px; vertical-align:middle; }
    .tag.fact{background:var(--fact)} .tag.calculation{background:var(--calc)} .tag.inference{background:var(--infer)} .tag.limitation{background:var(--limit)}
    .ref { color:#9099a3; font-size:.78rem; }
    .copybox textarea { width:100%; height:320px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8rem; border:1px solid var(--bd); border-radius:8px; padding:12px; background:#fbfcfd; }
    button.copy { background:#111827; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:.9rem; cursor:pointer; }
    button.copy:active { transform:translateY(1px); }
    .disclaimer { color:#9099a3; font-size:.8rem; margin-top:28px; }
    a { color:var(--calc); }
    .narrative { margin:0 0 4px; white-space:pre-wrap; }
    .evidence { list-style:none; padding:0; margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
    .evidence li { background:#f1f5f9; border:1px solid var(--bd); border-radius:7px; padding:3px 9px; font-size:.82rem; }
    .evidence b { color:#111827; }
    .evidence .ref { font-size:.72rem; }
    .watch { border:1px solid var(--bd); border-radius:10px; padding:12px 14px; margin:10px 0; background:#fbfcfd; }
    .watch.caution { background:#fdf6f0; border-color:#f0d4c0; }
    .watch.caution .signals span { background:#fdeede; color:#b45309; }
    .watch h3 { margin:0 0 4px; font-size:1rem; }
    .watch .sector { color:#6b7280; font-weight:500; font-size:.82rem; }
    .signals { margin:8px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
    .signals span { background:#eef6ff; color:var(--calc); border-radius:6px; padding:2px 8px; font-size:.78rem; }
    .uncertain { color:#b07d18; font-size:.84rem; margin-top:6px; }
    .levels { margin-top:8px; font-size:.9rem; }
    .levels b { color:#111827; }
    .risks li, .follows li { margin:4px 0; }
    .news { list-style:none; padding:0; margin:0; }
    .news li { padding:9px 0; border-bottom:1px dashed var(--bd); }
    .news li:last-child { border-bottom:0; }
    .news .src { color:#9099a3; font-size:.78rem; }
    .news .take { font-size:.9rem; margin-top:2px; }
    .badge { display:inline-block; background:#eef2f7; color:#475569; border-radius:6px; padding:1px 8px; font-size:.74rem; margin-left:6px; }
    .gr { font-size:.86rem; border-radius:10px; padding:10px 14px; margin:14px 0; }
    .gr.ok { background:#ecfdf3; border:1px solid #b9e6c9; color:#1b8a5a; }
    .gr.warn { background:#fffbeb; border:1px solid #fde68a; color:#92660a; }
    .gr ul { margin:6px 0 0; padding-left:18px; }
    .tier { display:inline-block; border-radius:6px; padding:0 6px; font-size:.7rem; margin-left:6px; }
    .tier.social { background:#fdeede; color:#b45309; }
    .tier.authoritative { background:#eef6ff; color:#1f6feb; }
    a.hist { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
             background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px 16px; margin:10px 0; }
    a.hist:hover { border-color:#c7d2e0; background:#fbfcfd; }
    .hist-date { font-weight:700; color:var(--calc); min-width:92px; font-size:.92rem; }
    .hist-body { flex:1; }
    .hist-type { color:#6b7280; font-size:.78rem; }
    .hist-head { margin-top:2px; }
    .hist-go { color:#c7d2e0; font-size:1.4rem; }
    .nav { margin:0 0 4px; font-size:.9rem; }
    .nav a { text-decoration:none; }

    /* 本月 AI 花費橫幅（最外層，含晨報＋問答） */
    .cost-banner { background:linear-gradient(135deg,#1f6feb,#0ea5e9); color:#fff; border-radius:14px;
      padding:16px 20px; margin:0 0 22px; box-shadow:0 6px 20px rgba(31,111,235,.18); }
    .cost-banner .cb-top { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; }
    .cost-banner .cb-label { font-size:.84rem; opacity:.92; }
    .cost-banner .cb-amount { font-size:1.5rem; font-weight:800; letter-spacing:.3px; }
    .cost-banner .cb-amount small { font-size:.86rem; font-weight:600; opacity:.85; }
    .cost-banner .cb-bar { height:7px; background:rgba(255,255,255,.28); border-radius:99px; margin:11px 0 8px; overflow:hidden; }
    .cost-banner .cb-fill { height:100%; background:#fff; border-radius:99px; transition:width .4s; }
    .cost-banner .cb-sub { font-size:.8rem; opacity:.92; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

    /* 回到最上方 浮動按鈕 */
    #backTop { position:fixed; right:20px; bottom:24px; width:46px; height:46px; border-radius:50%; border:0;
      background:#111827; color:#fff; font-size:1.3rem; line-height:1; cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.25); opacity:0; visibility:hidden;
      transition:opacity .2s, transform .2s, visibility .2s; z-index:50; }
    #backTop.show { opacity:.92; visibility:visible; }
    #backTop:hover { transform:translateY(-2px); opacity:1; }

    /* 底部導覽（回上頁 / 回到最上方） */
    .bottom-nav { display:flex; gap:12px; margin:30px 0 8px; }
    .bottom-nav a, .bottom-nav button { flex:1; text-align:center; border-radius:10px; padding:13px;
      font-weight:600; font-size:1rem; cursor:pointer; font-family:inherit; }
    .bottom-nav a { text-decoration:none; background:var(--card); border:1px solid var(--bd); color:var(--calc); }
    .bottom-nav a:hover { border-color:#c7d2e0; background:#fbfcfd; }
    .bottom-nav button { background:#111827; color:#fff; border:0; }
    .bottom-nav button:active { transform:translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">{% block content %}{% endblock %}</div>
  <button id="backTop" title="回到最上方" aria-label="回到最上方">↑</button>
  <script>
    (function () {
      var b = document.getElementById('backTop');
      window.addEventListener('scroll', function () {
        if (window.scrollY > 320) b.classList.add('show'); else b.classList.remove('show');
      }, { passive: true });
      b.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    })();
  </script>
</body>
</html>
