<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI 多市場研究報告{% endblock %}</title>
  <style>
    :root { --fact:#1b8a5a; --calc:#1f6feb; --infer:#b07d18; --limit:#6b7280; --bg:#f7f8fa; --card:#fff; --bd:#e3e6ea; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#1a1d21; font-family:-apple-system,"Noto Sans TC","Segoe UI",Roboto,sans-serif; line-height:1.6; }
    .wrap { max-width:860px; margin:0 auto; padding:24px 18px 80px; }
    header h1 { margin:0 0 4px; font-size:1.5rem; }
    .meta { color:#6b7280; font-size:.86rem; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:18px 20px; margin:16px 0; }
    .summary { font-size:1.06rem; }
    h2 { font-size:1.12rem; margin:22px 0 8px; }
    ul.claims { list-style:none; padding:0; margin:0; }
    ul.claims li { padding:7px 0; border-bottom:1px dashed var(--bd); }
    ul.claims li:last-child { border-bottom:0; }
    .tag { display:inline-block; font-size:.72rem; font-weight:700; color:#fff; border-radius:5px; padding:1px 7px; margin-right:7px; vertical-align:middle; }
    .tag.fact{background:var(--fact)} .tag.calculation{background:var(--calc)} .tag.inference{background:var(--infer)} .tag.limitation{background:var(--limit)}
    .ref { color:#9099a3; font-size:.78rem; }
    .copybox textarea { width:100%; height:320px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8rem; border:1px solid var(--bd); border-radius:8px; padding:12px; background:#fbfcfd; }
    button.copy { background:#111827; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:.9rem; cursor:pointer; }
    button.copy:active { transform:translateY(1px); }
    .disclaimer { color:#9099a3; font-size:.8rem; margin-top:28px; }
    a { color:var(--calc); }
  </style>
</head>
<body>
  <div class="wrap">{% block content %}{% endblock %}</div>
</body>
</html>
