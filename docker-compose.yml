# AI 多市場研究助理 — docker-compose
# M0 範圍：backend + redis（無 Postgres，見 ARCHITECTURE.md §5/§2）。
# 後續里程碑加入：discord-bot(M4)、scheduler(M3)、cloudflared(M6)。設計見 design_docs §26.1。

services:
  backend:
    build: ./backend
    container_name: ai-market-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # runtime 資料掛 /data，避免蓋掉 /app/storage 這個 Python 套件
      - LOCAL_STORAGE_PATH=/data
    volumes:
      - ./storage:/data
      - ./configs:/app/configs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: ./scheduler
    container_name: ai-market-scheduler
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      # 排程時區與時間點改由 .env 控制（SCHEDULE_TZ / REPORT_TIMES）
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: ./bot
    container_name: ai-market-bot
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Qlib 隔離離線因子/排序（階段 3[8]）：pyqlib 重且 Python 版本挑剔，獨立成 image，
  # 與 backend 互不污染。離線讀 ./storage 的 parquet、寫 qlib_scores/qlib_meta.json 回去；
  # serving(backend) 只讀 JSON、永不 import qlib。啟動跑一次 eval+score，之後每日 03:00 台北重跑。
  # 不 depends_on backend（純離線、互不阻塞）。手動評估：docker compose run --rm qlib python run.py --eval
  qlib:
    build: ./qlib_offline
    container_name: ai-market-qlib
    env_file:
      - .env
    environment:
      - LOCAL_STORAGE_PATH=/data
      - CONFIGS_DIR=/app/configs
    volumes:
      - ./storage:/data
      - ./configs:/app/configs
    restart: unless-stopped

  # 反向代理：對齊既有 Cloudflare tunnel ingress（www.hank-finflow.com → http://caddy:80）
  caddy:
    image: caddy:2
    container_name: ai-market-caddy
    command: caddy reverse-proxy --from :80 --to backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-market-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      caddy:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ai-market-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
